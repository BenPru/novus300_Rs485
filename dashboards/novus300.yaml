title: Lüftung
views:
  - title: Übersicht
    path: novus300
    icon: mdi:fan
    cards:
      - type: picture-elements
        image: /novus300bus/novus300-airflow.svg?v=8
        elements:
          - type: state-label
            entity: sensor.novus300_outdoor_air_temperature
            style:
              top: 46%
              left: 16%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: state-label
            entity: sensor.novus300_supply_air_temperature
            style:
              top: 46%
              left: 84%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: state-label
            entity: sensor.novus300_exhaust_air_temperature
            style:
              top: 84%
              left: 16%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: state-label
            entity: sensor.novus300_extract_air_temperature
            style:
              top: 84%
              left: 84%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: state-icon
            entity: sensor.novus300_outdoor_air_temperature
            icon: mdi:weather-partly-cloudy
            tap_action:
              action: more-info
            style:
              top: 22.7%
              left: 4.2%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: state-icon
            entity: sensor.novus300_supply_air_temperature
            icon: mdi:home-import-outline
            tap_action:
              action: more-info
            style:
              top: 22.7%
              left: 95.8%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: state-icon
            entity: sensor.novus300_exhaust_air_temperature
            icon: mdi:weather-windy
            tap_action:
              action: more-info
            style:
              top: 60%
              left: 4.2%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: state-icon
            entity: sensor.novus300_extract_air_temperature
            icon: mdi:home-export-outline
            tap_action:
              action: more-info
            style:
              transform: translate(-50%, -50%) scaleX(-1)
              top: 60%
              left: 95.8%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: state-label
            entity: select.novus300_ventilation_mode
            style:
              top: 62%
              left: 41%
              color: "#ffffff"
              font-size: 16px
              font-weight: bold
          - type: state-label
            entity: fan.novus300
            attribute: percentage
            suffix: " %"
            style:
              top: 62%
              left: 60%
              color: "#ffffff"
              font-size: 16px
              font-weight: bold
          - type: conditional
            conditions:
              - entity: fan.novus300
                attribute: bypass_present
                state_not: "false"
            elements:
              - type: state-icon
                entity: switch.novus300_bypass
                style:
                  top: 78%
                  left: 50%
                  "--mdc-icon-size": 44px
                  color: "#ffffff"
      - type: vertical-stack
        cards:
        - type: tile
          entity: select.novus300_ventilation_mode
          name: Lüftungsstufe
          color: green
          features:
            - type: select-options
              style: buttons
        - type: tile
          entity: fan.novus300
          name: Lüftung
          features:
            - type: fan-speed
        - type: horizontal-stack
          cards:
            - type: tile
              entity: button.novus300_boost
              name: Stoßlüftung
              hide_state: true
              color: blue
              visibility:
                - condition: state
                  entity: fan.novus300
                  attribute: ventilation_mode
                  state: boost
            - type: tile
              entity: button.novus300_boost
              name: Stoßlüftung
              hide_state: true
              visibility:
                - condition: state
                  entity: fan.novus300
                  attribute: ventilation_mode
                  state_not: boost
            - type: tile
              entity: switch.novus300_bypass
              name: Bypass geöffnet
              color: orange
              tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: fan.novus300
                  attribute: bypass_present
                  state_not: "false"
            - type: tile
              entity: switch.novus300_summer_ventilation
              name: Sommerlüftung
              visibility:
                - condition: state
                  entity: switch.novus300_summer_ventilation
                  state_not: unavailable
                - condition: state
                  entity: switch.novus300_summer_ventilation
                  state_not: unknown
        - type: tile
          entity: switch.novus300_power
          name: Betriebsstatus
      - type: history-graph
        title: Lufttemperaturen
        hours_to_show: 24
        entities:
          - entity: sensor.novus300_outdoor_air_temperature
            name: Außenluft
          - entity: sensor.novus300_supply_air_temperature
            name: Zuluft
          - entity: sensor.novus300_extract_air_temperature
            name: Abluft
          - entity: sensor.novus300_exhaust_air_temperature
            name: Fortluft
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.novus300_message
                name: Meldung
                color: red
                visibility:
                  - condition: state
                    entity: sensor.novus300_message
                    state_not: Keine Meldung
              - type: tile
                entity: sensor.novus300_message
                name: Meldung
                visibility:
                  - condition: state
                    entity: sensor.novus300_message
                    state: Keine Meldung
              - type: tile
                entity: sensor.novus300_filter_time_remaining
                name: Filter-Restlaufzeit
                color: red
                visibility:
                  - condition: numeric_state
                    entity: sensor.novus300_filter_time_remaining
                    below: 0.01
              - type: tile
                entity: sensor.novus300_filter_time_remaining
                name: Filter-Restlaufzeit
                visibility:
                  - condition: numeric_state
                    entity: sensor.novus300_filter_time_remaining
                    above: 0.01
          - type: entities
            title: Wartung
            show_header_toggle: false
            entities:
            - entity: sensor.novus300_message
              name: Meldung
              secondary_info: occurred_at
            - entity: button.novus300_filter_reset
              name: Filter zurücksetzen
            - entity: sensor.novus300_filter_time_remaining
              name: Filter-Restlaufzeit
            - entity: sensor.novus300_operating_time
              name: Gesamtbetriebszeit
            - entity: sensor.novus300_fan_operating_time
              name: Lüfterbetriebszeit
      - type: entities
        title: Details (Attribute)
        show_header_toggle: false
        entities:
          - type: section
            label: Fan
          - type: attribute
            entity: fan.novus300
            attribute: ventilation_mode
            name: Lüftungsmodus
          - type: attribute
            entity: fan.novus300
            attribute: automatic_type
            name: Automatik-Art
          - type: attribute
            entity: fan.novus300
            attribute: bus_setpoint
            name: Sollwert vom Bus
            suffix: "%"
          - type: attribute
            entity: fan.novus300
            attribute: away_minutes_per_hour
            name: Abwesend, Minuten pro Stunde
          - type: attribute
            entity: fan.novus300
            attribute: analog_percentage
            name: 0-10 V Ausgang
            suffix: "%"
          - type: section
            label: Betriebsstatus
          - type: attribute
            entity: switch.novus300_power
            attribute: run_state
            name: Status
          - type: attribute
            entity: switch.novus300_power
            attribute: raw_value
            name: Rohwert
      - type: markdown
        title: Meldungen
        content: |
          {% set rows = state_attr('sensor.novus300_message', 'message_table') or [] %}
          | | Zeitpunkt | Code | Meldung | Hinweis |
          |---|---|---|---|---|
          {% for r in rows -%}
          | {{ r.row }} | {{ as_datetime(r.time).strftime('%d.%m.%Y %H:%M:%S') if r.time else '–' }} | {{ r.code if r.code is not none else '–' }} | {{ r.message }} | {{ r.hint or '–' }} |
          {% endfor %}
      - type: markdown
        title: Bauteile
        content: |
          {% set f = 'fan.novus300' %}
          {% macro vorhanden(a) %}{% set v = state_attr(f, a) %}{{ 'vorhanden' if v == true else 'nicht vorhanden' if v == false else 'unbekannt' }}{% endmacro %}
          **Bypass:** {{ vorhanden('bypass_present') }}{% if state_attr(f, 'bypass_present') == true and states('switch.novus300_bypass') in ('on', 'off') %}, {{ 'auf' if is_state('switch.novus300_bypass', 'on') else 'zu' }} (Luftweg: {{ state_attr('switch.novus300_bypass', 'air_path') }}, Statuswort: {{ state_attr('switch.novus300_bypass', 'raw_value') }}){% endif %}<br>
          **Nachheizregister:** {{ vorhanden('reheater_present') }}<br>
          **Erdwärmetauscher (EWT-Klappe):** {{ vorhanden('ewt_present') }}<br>
          **Defroster:** {{ vorhanden('defroster_present') }}<br>
          **Sole-Defroster:** {{ vorhanden('brine_defroster_present') }}
      - type: markdown
        title: Statuswechsel
        content: |
          {% set events = state_attr('sensor.novus300_message', 'status_events') or [] %}
          {% for event in events %}
          {{ event }}<br>
          {% else %}
          Keine Statuswechsel beobachtet.
          {% endfor %}
      - type: markdown
        title: Geräte und Versionen
        content: |
          {% set sw = 'switch.novus300_power' %}
          **[{{ device_attr(sw, 'name') }}](/config/devices/device/{{ device_id(sw) }})**<br>
          {{ device_attr(sw, 'manufacturer') }} {{ device_attr(sw, 'model') }}, Firmware {{ device_attr(sw, 'sw_version') }}<br>
          {% for name, key in [('Bedienteil', 'serial_panel'), ('Lüfter-Slave', 'serial_fan_slave'), ('Defroster', 'serial_defroster')] %}
          {% set id = device_id('Paul Novus 300 ' ~ name) %}
          {% if id %}[{{ name }}](/config/devices/device/{{ id }}){% else %}{{ name }}{% endif %}: {{ state_attr(sw, key) or '–' }}<br>
          {% endfor %}
      - type: markdown
        title: Konfiguration
        content: |
          {% set sw = 'switch.novus300_power' %}
          Stufe 1 / 2 / 3: {{ state_attr(sw, 'config_fan_level_1_percentage') }} / {{ state_attr(sw, 'config_fan_level_2_percentage') }} / {{ state_attr(sw, 'config_fan_level_3_percentage') }} %<br>
          Stoßlüftung: {{ state_attr(sw, 'config_boost_duration_minutes') }} min<br>
          Abwesend: {{ state_attr(sw, 'config_away_minutes_per_hour') }} min pro Stunde<br>
          Filterintervall: {{ state_attr(sw, 'config_filter_interval_days') }} Tage<br>
          [Einstellungen ändern](/config/integrations/integration/novus300bus)
  - title: Sensoren
    path: novus300-sensoren
    type: sections
    max_columns: 2
    icon: mdi:thermometer
    sections:
    - type: grid
      cards:
      - type: picture-elements
        image: /novus300bus/novus300-base.svg?v=3
        elements:
        - type: state-label
          entity: sensor.novus300_extract_air_temperature
          style:
            left: 85.7%
            top: 54.5%
            color: '#ffffff'
            background-color: '#0b6fa8'
            padding: 2px 6px
            border-radius: 4px
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
        - type: state-label
          entity: sensor.novus300_supply_air_temperature
          style:
            left: 62.7%
            top: 55%
            color: '#ffffff'
            background-color: '#b3302d'
            padding: 2px 6px
            border-radius: 4px
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
        - type: state-label
          entity: sensor.novus300_outdoor_air_temperature
          style:
            left: 85.7%
            top: 73%
            color: '#ffffff'
            background-color: '#2e7d32'
            padding: 2px 6px
            border-radius: 4px
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
        - type: state-label
          entity: sensor.novus300_exhaust_air_temperature
          style:
            left: 62.7%
            top: 71.3%
            color: '#000000'
            background-color: '#ffd54f'
            padding: 2px 6px
            border-radius: 4px
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
        - type: conditional
          conditions:
          - entity: fan.novus300
            attribute: reheater_present
            state_not: 'false'
          elements:
          - type: image
            image: /novus300bus/novus300-reheater.svg?v=3
            style:
              left: 50%
              top: 50%
              width: 100%
              pointer-events: none
        - type: conditional
          conditions:
          - entity: fan.novus300
            attribute: ewt_present
            state_not: 'false'
          elements:
          - type: image
            image: /novus300bus/novus300-ewt.svg?v=3
            style:
              left: 50%
              top: 50%
              width: 100%
              pointer-events: none
        - type: conditional
          conditions:
          - entity: fan.novus300
            attribute: ewt_present
            state_not: 'false'
          - entity: fan.novus300
            attribute: brine_defroster_present
            state: 'true'
          elements:
          - type: image
            image: /novus300bus/novus300-brine.svg?v=3
            style:
              left: 50%
              top: 50%
              width: 100%
              pointer-events: none
        - type: conditional
          conditions:
          - entity: fan.novus300
            attribute: bypass_present
            state_not: 'false'
          elements:
          - type: image
            image: /novus300bus/novus300-bypass.svg?v=3
            style:
              left: 50%
              top: 50%
              width: 100%
              pointer-events: none
        - type: conditional
          conditions:
          - entity: fan.novus300
            attribute: defroster_present
            state_not: 'false'
          elements:
          - type: image
            image: /novus300bus/novus300-defroster.svg?v=3
            style:
              left: 50%
              top: 50%
              width: 100%
              pointer-events: none
        - type: conditional
          conditions:
          - entity: fan.novus300
            attribute: bypass_present
            state_not: 'false'
          - entity: switch.novus300_bypass
            state: 'on'
          elements:
          - type: label
            text: 'Bypass: Auf'
            style:
              left: 69.8%
              top: 90.5%
              color: '#ffffff'
              background-color: '#334e68'
              padding: 2px 6px
              border-radius: 4px
              font-size: clamp(6px, 1.3vw, 13px)
              font-weight: bold
        - type: conditional
          conditions:
          - entity: fan.novus300
            attribute: bypass_present
            state_not: 'false'
          - entity: switch.novus300_bypass
            state: 'off'
          elements:
          - type: label
            text: 'Bypass: Zu'
            style:
              left: 69.8%
              top: 90.5%
              color: '#ffffff'
              background-color: '#334e68'
              padding: 2px 6px
              border-radius: 4px
              font-size: clamp(6px, 1.3vw, 13px)
              font-weight: bold
        - type: state-label
          entity: select.novus300_ventilation_mode
          style:
            left: 78.3%
            top: 56%
            color: '#ffffff'
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
            white-space: nowrap
        - type: state-label
          entity: fan.novus300
          style:
            left: 78.3%
            top: 61.5%
            color: '#ffffff'
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
            white-space: nowrap
          attribute: percentage
          suffix: ' %'
        - type: conditional
          conditions:
          - entity: sensor.novus300_message
            state: Keine Meldung
          elements:
          - type: icon
            icon: mdi:check-circle
            entity: sensor.novus300_message
            tap_action:
              action: more-info
            style:
              left: 5%
              top: 8%
              color: '#66bb6a'
              --mdc-icon-size: clamp(14px, 2.6vw, 28px)
        - type: conditional
          conditions:
          - entity: sensor.novus300_message
            state_not: Keine Meldung
          elements:
          - type: icon
            icon: mdi:alert
            entity: sensor.novus300_message
            tap_action:
              action: more-info
            style:
              left: 5%
              top: 8%
              color: '#ef5350'
              --mdc-icon-size: clamp(14px, 2.6vw, 28px)
        - type: state-label
          entity: sensor.novus300_message
          style:
            left: 20%
            top: 8%
            color: '#ffffff'
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
            white-space: nowrap
        - type: conditional
          conditions:
          - condition: numeric_state
            entity: sensor.novus300_filter_time_remaining
            below: 1
          elements:
          - type: icon
            icon: mdi:air-filter
            entity: sensor.novus300_filter_time_remaining
            tap_action:
              action: more-info
            style:
              left: 5%
              top: 17%
              color: '#ef5350'
              --mdc-icon-size: clamp(14px, 2.6vw, 28px)
        - type: conditional
          conditions:
          - condition: numeric_state
            entity: sensor.novus300_filter_time_remaining
            above: 0.99
          elements:
          - type: icon
            icon: mdi:air-filter
            entity: sensor.novus300_filter_time_remaining
            tap_action:
              action: more-info
            style:
              left: 5%
              top: 17%
              color: '#8ad9f8'
              --mdc-icon-size: clamp(14px, 2.6vw, 28px)
        - type: state-label
          entity: sensor.novus300_filter_time_remaining
          style:
            left: 20%
            top: 17%
            color: '#ffffff'
            font-size: clamp(6px, 1.3vw, 13px)
            font-weight: bold
            white-space: nowrap
        grid_options:
          columns: full
      column_span: 2
