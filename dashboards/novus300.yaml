title: Lüftung
views:
  - title: Übersicht
    path: novus300
    icon: mdi:fan
    cards:
      - type: picture-elements
        image: /local/novus300-airflow.svg?v=7
        elements:
          - type: state-label
            entity: sensor.novus300_outdoor_air_temperature
            style:
              top: 46%
              left: 16%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: state-label
            entity: sensor.novus300_supply_air_temperature
            style:
              top: 46%
              left: 84%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: state-label
            entity: sensor.novus300_exhaust_air_temperature
            style:
              top: 84%
              left: 16%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: state-label
            entity: sensor.novus300_extract_air_temperature
            style:
              top: 84%
              left: 84%
              color: "#ffffff"
              font-size: 20px
              font-weight: bold
          - type: icon
            icon: mdi:weather-partly-cloudy
            style:
              top: 22.7%
              left: 4.2%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: icon
            icon: mdi:home-import-outline
            style:
              top: 22.7%
              left: 95.8%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: icon
            icon: mdi:weather-windy
            style:
              top: 60%
              left: 4.2%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: icon
            icon: mdi:home-export-outline
            style:
              transform: translate(-50%, -50%) scaleX(-1)
              top: 60%
              left: 95.8%
              color: "#8ad9f8"
              "--mdc-icon-size": 34px
          - type: state-label
            entity: select.novus300_ventilation_mode
            style:
              top: 62%
              left: 41%
              color: "#ffffff"
              font-size: 16px
              font-weight: bold
          - type: state-label
            entity: fan.novus300
            attribute: percentage
            suffix: " %"
            style:
              top: 62%
              left: 60%
              color: "#ffffff"
              font-size: 16px
              font-weight: bold
          - type: state-icon
            entity: switch.novus300_bypass
            style:
              top: 78%
              left: 50%
              "--mdc-icon-size": 44px
              color: "#ffffff"
      - type: vertical-stack
        cards:
        - type: entities
          title: Lüftungsstatus
          show_header_toggle: false
          entities:
            - entity: select.novus300_ventilation_mode
              name: Lüftungsstufe
        - type: custom:mushroom-chips-card
          alignment: center
          chips:
            - type: template
              icon: mdi:autorenew
              content: "Auto"
              icon_color: "{{ 'green' if is_state('select.novus300_ventilation_mode', 'automatic') else 'grey' }}"
              tap_action:
                action: call-service
                service: select.select_option
                target:
                  entity_id: select.novus300_ventilation_mode
                data:
                  option: automatic
            - type: template
              icon: mdi:numeric-1-circle
              content: "1"
              icon_color: "{{ 'green' if is_state('select.novus300_ventilation_mode', 'level_1') else 'grey' }}"
              tap_action:
                action: call-service
                service: select.select_option
                target:
                  entity_id: select.novus300_ventilation_mode
                data:
                  option: level_1
            - type: template
              icon: mdi:numeric-2-circle
              content: "2"
              icon_color: "{{ 'green' if is_state('select.novus300_ventilation_mode', 'level_2') else 'grey' }}"
              tap_action:
                action: call-service
                service: select.select_option
                target:
                  entity_id: select.novus300_ventilation_mode
                data:
                  option: level_2
            - type: template
              icon: mdi:numeric-3-circle
              content: "3"
              icon_color: "{{ 'green' if is_state('select.novus300_ventilation_mode', 'level_3') else 'grey' }}"
              tap_action:
                action: call-service
                service: select.select_option
                target:
                  entity_id: select.novus300_ventilation_mode
                data:
                  option: level_3
            - type: template
              icon: mdi:home-export-outline
              content: "Abw."
              icon_color: "{{ 'green' if is_state('select.novus300_ventilation_mode', 'away') else 'grey' }}"
              tap_action:
                action: call-service
                service: select.select_option
                target:
                  entity_id: select.novus300_ventilation_mode
                data:
                  option: away
            - type: template
              icon: mdi:fan-plus
              content: "Boost"
              icon_color: "{{ 'green' if is_state('select.novus300_ventilation_mode', 'boost') else 'grey' }}"
              tap_action:
                action: call-service
                service: select.select_option
                target:
                  entity_id: select.novus300_ventilation_mode
                data:
                  option: boost
        - type: tile
          entity: fan.novus300
          name: Lüftung
          features:
            - type: fan-speed
        - type: custom:mushroom-template-card
          primary: Stoßlüftung
          secondary: "{{ 'Aktiv' if is_state('select.novus300_ventilation_mode', 'boost') else 'Aus' }}"
          icon: "{{ 'mdi:fan-plus' if is_state('select.novus300_ventilation_mode', 'boost') else 'mdi:fan' }}"
          icon_color: "{{ 'orange' if is_state('select.novus300_ventilation_mode', 'boost') else 'grey' }}"
          entity: button.novus300_boost
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.novus300_boost
        - type: entities
          show_header_toggle: false
          entities:
            - entity: switch.novus300_power
              name: Betriebsstatus
        - type: custom:mushroom-template-card
          primary: Bypass geöffnet
          secondary: "{{ 'Ja' if is_state('switch.novus300_bypass', 'on') else 'Nein' }}"
          icon: "{{ 'mdi:arrow-right-bold-circle-outline' if is_state('switch.novus300_bypass', 'on') else 'mdi:heat-wave' }}"
          icon_color: "{{ 'orange' if is_state('switch.novus300_bypass', 'on') else 'grey' }}"
          entity: switch.novus300_bypass
          tap_action:
            action: more-info
      - type: history-graph
        title: Lufttemperaturen
        hours_to_show: 24
        entities:
          - entity: sensor.novus300_outdoor_air_temperature
            name: Außenluft
          - entity: sensor.novus300_supply_air_temperature
            name: Zuluft
          - entity: sensor.novus300_extract_air_temperature
            name: Abluft
          - entity: sensor.novus300_exhaust_air_temperature
            name: Fortluft
      - type: vertical-stack
        cards:
          - type: heading
            heading: Wartung
          - type: custom:mushroom-template-card
            primary: Meldung
            secondary: >-
              {% set t = state_attr('sensor.novus300_message', 'occurred_at') %}
              {{ states('sensor.novus300_message') }}{% if t %} · {{ as_timestamp(t) | timestamp_custom('%d.%m.%Y %H:%M') }}{% endif %}
            icon: "{{ 'mdi:message-check-outline' if is_state('sensor.novus300_message', 'Keine Meldung') else 'mdi:message-alert-outline' }}"
            icon_color: "{{ 'grey' if is_state('sensor.novus300_message', 'Keine Meldung') else 'red' }}"
            entity: sensor.novus300_message
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Filter-Restlaufzeit
            secondary: "{{ states('sensor.novus300_filter_time_remaining') | float(0) | round(0) | int }} Tage"
            icon: "{{ 'mdi:alert-circle-outline' if states('sensor.novus300_filter_time_remaining') | float(1) <= 0 else 'mdi:air-filter' }}"
            icon_color: "{{ 'red' if states('sensor.novus300_filter_time_remaining') | float(1) <= 0 else 'grey' }}"
            entity: sensor.novus300_filter_time_remaining
            tap_action:
              action: more-info
          - type: entities
            show_header_toggle: false
            entities:
              - entity: button.novus300_filter_reset
                name: Filter zurücksetzen
              - entity: sensor.novus300_operating_time
                name: Gesamtbetriebszeit
              - entity: sensor.novus300_fan_operating_time
                name: Lüfterbetriebszeit
      - type: entities
        title: Details (Attribute)
        show_header_toggle: false
        entities:
          - type: section
            label: Fan
          - type: attribute
            entity: fan.novus300
            attribute: ventilation_mode
            name: Lüftungsmodus
          - type: attribute
            entity: fan.novus300
            attribute: bus_setpoint
            name: Sollwert vom Bus
            suffix: "%"
          - type: attribute
            entity: fan.novus300
            attribute: away_minutes_per_hour
            name: Abwesend, Minuten pro Stunde
          - type: attribute
            entity: fan.novus300
            attribute: analog_percentage
            name: 0-10 V Ausgang
            suffix: "%"
          - type: section
            label: Betriebsstatus
          - type: attribute
            entity: switch.novus300_power
            attribute: run_state
            name: Status
          - type: attribute
            entity: switch.novus300_power
            attribute: raw_value
            name: Rohwert
          - type: section
            label: Bypass
          - type: attribute
            entity: switch.novus300_bypass
            attribute: air_path
            name: Luftweg
          - type: attribute
            entity: switch.novus300_bypass
            attribute: raw_value
            name: Statuswort
          - type: section
            label: Meldung
          - type: attribute
            entity: sensor.novus300_message
            attribute: code
            name: Code
          - type: attribute
            entity: sensor.novus300_message
            attribute: occurred_at
            name: Zeitpunkt
            format: datetime
          - type: attribute
            entity: sensor.novus300_message
            attribute: previous_message
            name: Vorherige Meldung
          - type: attribute
            entity: sensor.novus300_message
            attribute: previous_message_2
            name: Vorherige Meldung 2
          - type: attribute
            entity: sensor.novus300_message
            attribute: previous_message_3
            name: Vorherige Meldung 3
      - type: markdown
        title: Statuswechsel
        content: |
          {% set events = state_attr('sensor.novus300_message', 'status_events') or [] %}
          {% for event in events %}
          {{ event }}<br>
          {% else %}
          Keine Statuswechsel beobachtet.
          {% endfor %}
      - type: markdown
        title: Geräte und Versionen
        content: |
          {% set sw = 'switch.novus300_power' %}
          **[{{ device_attr(sw, 'name') }}](/config/devices/device/{{ device_id(sw) }})**<br>
          {{ device_attr(sw, 'manufacturer') }} {{ device_attr(sw, 'model') }}, Firmware {{ device_attr(sw, 'sw_version') }}<br>
          {% for name, key in [('Bedienteil', 'serial_panel'), ('Lüfter-Slave', 'serial_fan_slave'), ('Defroster', 'serial_defroster')] %}
          {% set id = device_id('Paul Novus 300 ' ~ name) %}
          {% if id %}[{{ name }}](/config/devices/device/{{ id }}){% else %}{{ name }}{% endif %}: {{ state_attr(sw, key) or '–' }}<br>
          {% endfor %}
      - type: markdown
        title: Konfiguration
        content: |
          {% set sw = 'switch.novus300_power' %}
          Stufe 1 / 2 / 3: {{ state_attr(sw, 'config_fan_level_1_percentage') }} / {{ state_attr(sw, 'config_fan_level_2_percentage') }} / {{ state_attr(sw, 'config_fan_level_3_percentage') }} %<br>
          Stoßlüftung: {{ state_attr(sw, 'config_boost_duration_minutes') }} min<br>
          Abwesend: {{ state_attr(sw, 'config_away_minutes_per_hour') }} min pro Stunde<br>
          Filterintervall: {{ state_attr(sw, 'config_filter_interval_days') }} Tage<br>
          [Einstellungen ändern](/config/integrations/integration/novus300bus)
